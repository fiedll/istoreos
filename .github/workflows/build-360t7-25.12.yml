name: Build iStoreOS 25.12 JDCloud AX1800 Pro

on:
  push:
    branches: [istoreos-25.12]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: istoreos-25.12-ax1800pro
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: istoreos-25.12
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm flex bison gawk gettext git rsync unzip file wget python3 python3-setuptools python3-pip python3-dev libncurses-dev zlib1g-dev libssl-dev libelf-dev device-tree-compiler xsltproc swig time ccache dwarves patch quilt libtool-bin

      - name: Verify host tools
        run: |
          command -v clang && clang --version
          command -v llc && llc --version
          command -v pahole && pahole --version

      - name: Prepare feeds and packages
        run: |
          chmod +x scripts/prepare-360t7-25.12.sh
          ./scripts/prepare-360t7-25.12.sh

      - name: Configure JDCloud AX1800 Pro
        run: |
          cp config/360t7-25.12.config .config
          make defconfig
          grep -E '^CONFIG_TARGET_(qualcommax|ARCH_PACKAGES)|^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=' .config || true
          grep -E '^CONFIG_PACKAGE_(mosdns|luci-app-mosdns|dae|daed|luci-app-daede|tailscale|kmod-tun|luci-app-passwall|xray-core|sing-box)=' .config || true
          test "$(grep -c '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y' .config)" -eq 1
          ! grep -q '^CONFIG_TARGET_mediatek=' .config

      - name: Download sources
        run: make -j$(nproc) download V=s

      - name: Build firmware
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Verify image
        run: |
          OUT=bin/targets/qualcommax/ipq60xx
          find "$OUT" -maxdepth 1 -type f -printf '%p\n' | sort
          test -n "$(find "$OUT" -type f -name '*jdcloud_re-ss-01*' | head -1)"
          test -n "$(find "$OUT" -type f -name '*sysupgrade*' | head -1)"
          echo "JDCloud RE-SS-01 sysupgrade image verified."

      - name: Upload firmware and log
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-25.12-jdcloud-re-ss-01-mosdns-daed-tailscale-passwall
          path: |
            bin/targets/qualcommax/ipq60xx/*
            bin/packages/aarch64_cortex-a53/*
            build.log
          if-no-files-found: error
